[package]
name = "kronosdb-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mimalloc = { version = "0.1", default-features = false }
kronosdb-eventstore = { path = "../kronosdb-eventstore" }
kronosdb-messaging = { path = "../kronosdb-messaging" }
kronosdb-protocol = { path = "../kronosdb-protocol" }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
bytes = "1"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
dashmap = "6"
tokio-stream = "0.1"
tokio-util = "0.7"
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = "0.8"
rust-embed = { version = "8", features = ["compression"] }
mime_guess = "2"
uuid = { version = "1", features = ["v4"] }
socket2 = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
jsonwebtoken = "9"
axum-extra = { version = "0.10", features = ["cookie", "cookie-signed"] }
subtle = "2"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
x509-parser = "0.17"
http = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
kronosdb-client = { path = "../kronosdb-client" }
rcgen = "0.13"
tempfile = "3"

[lints]
workspace = true
