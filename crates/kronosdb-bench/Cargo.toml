[package]
name = "kronosdb-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
kronosdb-eventstore = { path = "../kronosdb-eventstore", features = ["bench-instrumentation"] }
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Needed by the log_store_only microbench (Plan 07-01) so it can construct
# `Entry<TypeConfig>` directly and drive `LogStore::append_test`. Must match
# the version + features pinned in `kronosdb-eventstore/Cargo.toml` so there's
# only one `openraft` in the dep graph.
openraft = { version = "0.9", features = ["serde", "storage-v2"] }

[[bin]]
name = "aggregate_baseline"
path = "src/bin/aggregate_baseline.rs"

[package.metadata.release]
release = false

# --- Storage engine benchmarks ---

[[bench]]
name = "append_throughput"
harness = false

[[bench]]
name = "source_read"
harness = false

[[bench]]
name = "source_cached_vs_cold"
harness = false

[[bench]]
name = "bloom_filter"
harness = false

[[bench]]
name = "concurrent_read_write"
harness = false

[[bench]]
name = "scale_behavior"
harness = false

[[bench]]
name = "group_commit"
harness = false

[[bench]]
name = "throughput_sustained"
harness = false

[[bench]]
name = "raft_append_baseline"
harness = false

[[bench]]
name = "log_store_only"
harness = false

[[bench]]
name = "raft_append_3node"
harness = false
