[package]
name = "kronosdb-eventstore"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Off by default. Enabled by the kronosdb-bench crate for phase-1 baseline measurement.
# Inserts scoped std::time::Instant timers at four named hotspots plus an fsync syscall
# counter. Must compile out completely when the feature is off — no runtime cost in release.
bench-instrumentation = []

[dependencies]
crc32c = "0.6"
memmap2 = "0.9"
libc = "0.2"
roaring = "0.10"
parking_lot = "0.12"
dashmap = "6"
# Sealed segments' key filters. Pinned: the filter is persisted in `.idx`
# files, so its construction and hashing are part of the file format.
xorf = { version = "=0.13.0", default-features = false, features = ["binary-fuse"] }
bincode = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync", "rt", "fs", "io-util"] }
tokio-stream = "0.1"
futures-util = "0.3"
async-trait = "0.1"
lru = "0.14"
foldhash = "0.1"

# Raft consensus
openraft = { version = "0.9", features = ["serde", "storage-v2"] }
kronosdb-protocol = { path = "../kronosdb-protocol" }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
bytes = "1"
tracing = "0.1"
fs2 = "0.4"

# Tiered storage (ADR-0002): sealed-segment backup to object storage
object_store = { version = "0.14", features = ["aws"] }
url = "2"
serde_json = "1"
blake3 = "1"

[dev-dependencies]
kronosdb-client = { path = "../kronosdb-client" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
blake3 = "1"

[lints]
workspace = true
