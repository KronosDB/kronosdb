syntax = "proto3";
package kronosdb.eventstore;
option java_package = "io.kronosdb.grpc.eventstore";
option java_multiple_files = true;

/* The Event Store service. */
service EventStore {

  /* Appends new events to the store. One request carries the whole
     transaction: the repeated events field is the batch, all-or-nothing. */
  rpc Append (AppendRequest) returns (AppendResponse);

  /* Provides a finite stream of events matching the given criteria. */
  rpc Source (SourceRequest) returns (stream SourceResponse);

  /* Provides an infinite stream of events matching the given criteria.
     Stays open and pushes new events as they are appended.
     Bidirectional with permit-based flow control: the first client message
     carries the criteria and initial permits. Subsequent messages grant
     additional permits. The server only sends events when permits > 0. */
  rpc Stream (stream StreamControl) returns (stream StreamResponse);

  /* Gets the current head of the event store: the position just past the last
     readable event.

     A cursor that has drained the store equals this value, so `head - cursor`
     is a valid measure of how far behind a consumer is, and a poll that waits
     for the two to meet terminates. Note that positions are not necessarily
     contiguous — reads may skip positions — so advance a cursor by the
     positions you actually receive, never by incrementing through the range. */
  rpc GetHead (GetHeadRequest) returns (GetHeadResponse);

  /* Gets the current tail of the event store (first event position). */
  rpc GetTail (GetTailRequest) returns (GetTailResponse);

  /* Gets tags for an event by its sequence position. */
  rpc GetTags (GetTagsRequest) returns (GetTagsResponse);

  /* Gets the sequence number of the first event at or after the given timestamp.
     Used by event processors to support time-based replay (e.g., Axon's tokenAt). */
  rpc GetSequenceAt (GetSequenceAtRequest) returns (GetSequenceAtResponse);

  /* Appends a snapshot record to the log (ADR-0005). Replicated like any
     append; the server stores opaque bytes under a client-composed key and
     never interprets them. A newer snapshot for the same key supersedes
     older ones purely by being later in the log. */
  rpc AppendSnapshot (AppendSnapshotRequest) returns (AppendSnapshotResponse);

  /* The fused read: the latest snapshot under the key plus all events
     matching the criteria from the snapshot's fold marker onward, one
     stream, one consistent view. Without a snapshot it behaves exactly
     like Source from the beginning. Ends with the same consistency marker
     Source ends with — conditional appends work identically on both paths. */
  rpc SnapshottedSource (SnapshottedSourceRequest) returns (stream SnapshottedSourceResponse);

  /* The latest snapshot alone, no events. For adapters whose interfaces
     load snapshots separately (e.g. the Axon connector); SnapshottedSource
     is the intended path for event-sourced rehydration. */
  rpc GetSnapshot (GetSnapshotRequest) returns (GetSnapshotResponse);

  /* Tag mutations (AddTags/RemoveTags) and other transformations are admin
     operations handled via a separate HTTP admin API, not this gRPC service. */
}

/* An event as provided by the client. */
message Event {
  /* Client-provided unique identifier. */
  string identifier = 1;
  /* Timestamp in milliseconds since epoch. Client-provided. */
  int64 timestamp = 2;
  /* The event type name (e.g., "OrderPlaced"). */
  string name = 3;
  /* The schema version of the event payload. */
  string version = 4;
  /* The opaque event payload. */
  bytes payload = 5;
  /* Arbitrary key-value metadata. */
  map<string, string> metadata = 6;
}

/* A tag describing an event. Key-value pair using domain concepts. */
message Tag {
  bytes key = 1;
  bytes value = 2;
}

/* An event with its tags, used for appending. */
message TaggedEvent {
  Event event = 1;
  repeated Tag tags = 2;
}

/* An event with its assigned sequence position, returned on reads. */
message SequencedEvent {
  int64 sequence = 1;
  Event event = 2;
}

/* Request to append events. The repeated events field carries the batch. */
message AppendRequest {
  /* Optional consistency condition. If omitted, events are appended unconditionally. */
  ConsistencyCondition condition = 1;
  /* Events to append. All-or-nothing transaction. */
  repeated TaggedEvent events = 2;
}

/* Response to a successful append. */
message AppendResponse {
  /* Sequence of the first event appended. */
  int64 first_sequence = 1;
  /* Number of events appended. */
  int32 count = 2;
  /* Consistency marker for subsequent appends. */
  int64 consistency_marker = 3;
}

/* The consistency condition for conditional appends.
   "Reject if any event matching the criteria exists after the consistency marker." */
message ConsistencyCondition {
  /* Position after which to check for conflicts. Events with sequence > this are checked. */
  int64 consistency_marker = 1;
  /* Criteria defining which events would conflict. */
  repeated Criterion criteria = 2;
}

/* A single criterion. Matches an event if ALL tags are present AND the event name
   is in the names list (if names is non-empty). */
message Criterion {
  /* Event type names. If non-empty, the event name must match one of these. */
  repeated string names = 1;
  /* Tags that must ALL be present on the event. */
  repeated Tag tags = 2;
}

/* Request to source (finite read) events matching criteria. */
message SourceRequest {
  /* Inclusive starting sequence position. */
  int64 from_sequence = 1;
  /* Criteria to filter events. If empty, all events are returned. */
  repeated Criterion criteria = 2;
  /* Maximum events per response message. 0 = server default (1024).
     Batches never wait for events — the server sends whatever it has in
     hand, so latency is unaffected; only per-message framing overhead is
     amortized. */
  uint32 batch_size = 3;
}

/* A batch of sequenced events, in ascending sequence order. */
message SequencedEventBatch {
  repeated SequencedEvent events = 1;
  /* Present on the FINAL batch of a Source stream: the next-exclusive
     consistency marker for subsequent DCB-conditioned appends. A source
     with no matching events still ends with one (empty) marker-carrying
     batch. Absent on Stream responses and non-final Source batches.

     Opaque: pass it back in a ConsistencyCondition, unmodified. It counts
     positions GetHead does not, so comparing the two — or doing any
     arithmetic against event sequences — yields nonsense. */
  optional int64 consistency_marker = 2;
}

/* Response containing a batch of matching events. The final batch carries
   the consistency marker — there is no separate marker frame. */
message SourceResponse {
  /* Field 1 was a per-event `SequencedEvent event`; field 2 was a separate
     terminal `consistency_marker` frame (pre-0.7 servers). */
  reserved 1, 2;
  reserved "event", "consistency_marker";
  /* A batch of matching events. */
  SequencedEventBatch batch = 3;
}

/* Client-to-server messages on the Stream RPC.
   The first message MUST be a Subscribe; subsequent messages grant permits. */
message StreamControl {
  oneof request {
    /* Initial subscription — sent once to start the stream. */
    StreamSubscribe subscribe = 1;
    /* Grant additional permits — server may send one event per permit. */
    StreamPermits permits = 2;
  }
}

/* Opens the event stream with criteria and initial permits. */
message StreamSubscribe {
  /* Inclusive starting sequence position. */
  int64 from_sequence = 1;
  /* Criteria to filter events. If empty, all events are streamed. */
  repeated Criterion criteria = 2;
  /* Initial number of permits. The server will send at most this many events
     before waiting for more permits. Must be > 0. Permits count EVENTS, not
     messages — a batch of N events consumes N permits. */
  int64 initial_permits = 3;
  /* Optional: event type names to exclude from the stream.
     Events matching any of these names are silently skipped (payload blacklisting). */
  repeated string blacklisted_names = 4;
  /* Maximum events per response message. 0 = server default (1024). The
     server packs whatever is committed AND permitted into each message —
     it never waits to fill a batch, so tail latency is unaffected. */
  uint32 batch_size = 5;
}

/* Grants additional permits on an active stream. */
message StreamPermits {
  /* Number of additional permits to grant. */
  int64 permits = 1;
}

/* A message on the event stream — a batch of matching events or a keep-alive heartbeat. */
message StreamResponse {
  /* Field 1 was a per-event `SequencedEvent event` in pre-0.5 servers. */
  reserved 1;
  reserved "event";
  oneof result {
    /* Server heartbeat — sent periodically to detect slow/dead consumers.
       Clients should ignore this (no response needed). */
    StreamHeartbeat heartbeat = 2;
    /* A batch of matching events, in ascending sequence order. */
    SequencedEventBatch batch = 3;
  }
}

/* Keep-alive heartbeat on event streams. */
message StreamHeartbeat {}

message GetHeadRequest {}

message GetHeadResponse {
  /* The sequence of the next event to be appended. 0 for an empty store. */
  int64 sequence = 1;
}

message GetTailRequest {}

message GetTailResponse {
  /* The sequence of the first event in the store. 0 for an empty or non-truncated store. */
  int64 sequence = 1;
}

message GetTagsRequest {
  int64 sequence = 1;
}

message GetTagsResponse {
  repeated Tag tags = 1;
}

/* A snapshot: opaque client state at a point in the log. The server never
   interprets it — fitness, invalidation, and versioning are the client's
   business (invalidation is the client renaming its key). */
message Snapshot {
  /* Opaque state bytes, returned byte-exact. */
  bytes state = 1;
  /* The client's fold-time consistency marker — NOT the snapshot record's
     own log position. Markers are next-exclusive, so this is the sequence
     the replay resumes AT: events with sequence >= position are not
     summarized by the state. Pass the marker from the read/append the
     state was folded from, unmodified. */
  int64 position = 2;
}

message AppendSnapshotRequest {
  /* One client-composed opaque key; the client folds any entity id into it
     (e.g. "course:cs-101"). */
  bytes key = 1;
  /* Opaque state, forever. */
  bytes state = 2;
  /* The fold-time consistency marker (see Snapshot.position). */
  int64 position = 3;
}

message AppendSnapshotResponse {
  /* Log sequence of the snapshot record itself. Informational. */
  int64 sequence = 1;
}

message SnapshottedSourceRequest {
  /* Identical semantics to SourceRequest.criteria. */
  repeated Criterion criteria = 1;
  /* The snapshot key to resolve. */
  bytes key = 2;
  /* Maximum events per batch message. 0 = server default (1024). */
  uint32 batch_size = 3;
}

/* Stream frames: at most one snapshot frame, always first if present, then
   event batches. The final batch carries the consistency marker exactly as
   Source does — a stream with no events still ends with one (empty)
   marker-carrying batch. A snapshot is never delivered as an event. */
message SnapshottedSourceResponse {
  oneof frame {
    Snapshot snapshot = 1;
    SequencedEventBatch batch = 2;
  }
}

message GetSnapshotRequest {
  bytes key = 1;
}

message GetSnapshotResponse {
  /* Absent if no snapshot exists under the key — a miss is always legal;
     the caller replays from the beginning. */
  Snapshot snapshot = 1;
}

message GetSequenceAtRequest {
  /* Timestamp in milliseconds since epoch. */
  int64 timestamp = 1;
}

message GetSequenceAtResponse {
  /* Sequence of the first event at or after the given timestamp.
     -1 if no such event exists. */
  int64 sequence = 1;
}
