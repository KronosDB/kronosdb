name: helm-smoke

on:
  pull_request:
    paths:
      - "charts/**"
      - "scripts/helm-smoke.sh"
      - "Dockerfile"
      - ".github/workflows/helm-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build server image
        run: docker build -t kronosdb:smoke .

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the kronos CLI
        run: cargo build --release -p kronosdb-cli

      - name: Run smoke test
        run: IMAGE=kronosdb:smoke KRONOS=target/release/kronos scripts/helm-smoke.sh
