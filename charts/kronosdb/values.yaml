# KronosDB Helm chart values.
#
# The defaults produce a production-shaped 3-voter Raft cluster. The two
# decisions you cannot skip: storage (use local NVMe — replicated network
# volumes pay for replication twice; quorum + object-store backup is the
# durability story) and auth (set the tokens, or consciously run open).

image:
  repository: ghcr.io/kronosdb/kronosdb
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Voter count. 3 tolerates one node loss; 5 tolerates two. Even numbers buy
# nothing. NOTE: changing this after install does NOT resize the Raft
# cluster — membership changes go through the admin API first (see NOTES).
replicas: 3

# Passive-backup learners: replicate everything, never vote, never serve
# writes. Useful as an analytics read target or a warm copy in another zone.
learners:
  replicas: 0

clusterDomain: cluster.local

resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    memory: 4Gi

persistence:
  # Strongly prefer a local-NVMe class (e.g. openebs-lvm, topolvm,
  # local-path on bare metal). Acked writes are quorum-replicated; the
  # object-store backup (below) covers node loss beyond quorum.
  storageClassName: ""
  size: 100Gi

config:
  # auto = durable (fsync-before-ack) on a single voter. With 2+ voters each
  # node measures its data disk at startup (a ~100-write fdatasync probe) and
  # acks durably when the p99 is under 1 ms (local NVMe: ~0.2 ms, where durable
  # costs 3-19% throughput); on a slower disk (network volumes: 1-4 ms, where
  # durable costs 30-36%) it keeps written acks (quorum has the bytes; fsync
  # trails one group-commit wave). The measurement and the resulting mode are
  # logged at startup and exposed as kronosdb_disk_fsync_microseconds and
  # kronosdb_ack_durable on /metrics. "durable" forces fsync-before-ack
  # everywhere, "written" forces quorum-written acks; neither consults the
  # probe.
  #
  # Startup hardware warnings (slow fsync, tmpfs or network data dir, little
  # memory, swap, CPU limits) are logged at warn/error and exposed as
  # kronosdb_hardware_finding on /metrics. A throwaway dev cluster can quiet
  # them to info with KRONOSDB_DEV=1 via extraEnv below; never on production.
  ackMode: auto
  # Seconds the server waits for connections to drain on shutdown. The pod's
  # terminationGracePeriodSeconds is derived from this (+10).
  drainDeadlineSecs: 20
  # Extra KRONOSDB_* environment variables, applied to all nodes last —
  # e.g. group-commit tuning, cache sizes, OIDC settings for the console.
  extraEnv: []
  #  - name: KRONOSDB_GROUP_COMMIT_MS
  #    value: "1"

# Contexts declared in the manifest — the GitOps source of truth. The server
# applies additions LIVE (it watches the mounted manifest; no restart), and
# removing an entry never deletes or unloads a context — deletion stays an
# explicit admin operation. One context per service is the recommended
# multi-service layout.
contexts: []
#  - orders
#  - billing

# Roll the pods when the context manifest changes. Only needed for server
# images older than 0.7.1, which apply the manifest at startup rather than
# watching it; on current servers this just causes needless restarts.
rollOnManifestChange: false

backup:
  # Object-store URL (s3://…, gs://…, file://…) enabling sealed-segment
  # backup. Leave empty to disable. Cloud credentials come from the
  # environment — point credentialsSecret at a Secret with AWS_* keys etc.
  url: ""
  intervalSecs: 30
  credentialsSecret: ""

auth:
  # Client access token. Empty = an unauthenticated client port
  # (the chart will tell you so at install). Ignored if existingSecret set.
  accessToken: ""
  # Secret with key "access-token". Takes precedence over accessToken.
  existingSecret: ""

# Identity layer (ADR-0008): who may connect to the client port, and as what. Rendered
# verbatim into the server's [security] config, so keys are the TOML keys.
# Everything is optional and combines with auth.accessToken (which peers
# keep using unless an mtls grant gives them the "peer" role).
identity:
  # OIDC issuers whose JWTs are trusted — human SSO and workload identity
  # are the same thing here.
  issuers: []
  #  - name: google                      # gcloud auth print-identity-token
  #    issuer: https://accounts.google.com
  #    subject-claim: email
  #  - name: gke                         # pods' projected service-account tokens
  #    issuer: https://container.googleapis.com/v1/projects/P/locations/L/clusters/C
  #    audiences: [kronosdb]
  # Principal -> roles (read < write < admin; peer is internode only),
  # optionally narrowed to context/bus globs.
  grants: []
  #  - source: google
  #    subject: "*@example.com"
  #    claims: { hd: example.com, email_verified: true }
  #    roles: [read]
  #  - source: gke
  #    subject: system:serviceaccount:prod:orders
  #    roles: [write]
  #    contexts: [orders]
  # Named static tokens. Secrets stay out of the ConfigMap: put each token
  # under a key of tokenSecret and reference it by that key.
  tokens: []
  #  - name: ci
  #    secretKey: ci                     # key in tokenSecret
  #    roles: [write]
  #    contexts: ["orders-*"]
  tokenSecret: ""

admin:
  # none | token | oidc. "token" requires adminToken or existingSecret;
  # "oidc" is configured via config.extraEnv (KRONOSDB_OIDC_*).
  authMode: token
  adminToken: ""
  # Secret with key "admin-token". Takes precedence over adminToken.
  existingSecret: ""
  service:
    type: ClusterIP

tls:
  # Name of a kubernetes.io/tls Secret (tls.crt / tls.key, optional ca.crt)
  # for the client port. Empty = plaintext.
  secretName: ""
  # Verify client certificates against the Secret's ca.crt (mTLS).
  #   "" = off | required = every connection needs a certificate |
  #   optional = certificates and bearer tokens share the port (needs
  #   identity/auth configured — the server refuses to start otherwise).
  clientAuth: ""

service:
  # Client-facing service.
  type: ClusterIP

podDisruptionBudget:
  # Never let voluntary disruptions take out quorum.
  maxUnavailable: 1

# "required" refuses to schedule two voters on one node; "soft" prefers not
# to. Use "soft" only on clusters smaller than the replica count.
antiAffinity: required

# Spread voters across zones when the cluster is multi-zone (soft).
zoneSpread: true

serviceMonitor:
  # Prometheus-operator ServiceMonitor scraping /metrics on the admin port.
  enabled: false
  interval: 30s

alerts:
  # Prometheus-operator PrometheusRule with the production alert set:
  # poisoned engine, stalled writes, disk almost full, replication lag,
  # ack degradation, DCB rejection spikes.
  enabled: false
  replicationLagEvents: 100000
  dcbRejectionsPerSecond: 10

# Matches the image's kronosdb user so the PVC is writable.
podSecurityContext:
  fsGroup: 1000

startupProbe:
  # 60 × 5s = 5 minutes for segment recovery on large volumes.
  failureThreshold: 60
  periodSeconds: 5

nodeSelector: {}
tolerations: []
