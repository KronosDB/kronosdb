{{- $needAccess := and .Values.auth.accessToken (not .Values.auth.existingSecret) -}}
{{- $needAdmin := and (eq .Values.admin.authMode "token") .Values.admin.adminToken (not .Values.admin.existingSecret) -}}
{{- if or $needAccess $needAdmin }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kronosdb.fullname" . }}-auth
  labels: {{- include "kronosdb.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $needAccess }}
  access-token: {{ .Values.auth.accessToken | quote }}
  {{- end }}
  {{- if $needAdmin }}
  admin-token: {{ .Values.admin.adminToken | quote }}
  {{- end }}
{{- end }}
{{- if and (eq .Values.admin.authMode "token") (not .Values.admin.adminToken) (not .Values.admin.existingSecret) }}
{{- fail "admin.authMode is \"token\" but neither admin.adminToken nor admin.existingSecret is set. Set one, or explicitly choose admin.authMode=none." }}
{{- end }}
