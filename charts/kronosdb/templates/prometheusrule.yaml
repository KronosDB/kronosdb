{{- if .Values.alerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kronosdb.fullname" . }}
  labels: {{- include "kronosdb.labels" . | nindent 4 }}
spec:
  groups:
    - name: kronosdb
      rules:
        - alert: KronosDBEnginePoisoned
          expr: max by (context) (kronosdb_engine_poisoned) > 0
          for: 1m
          labels: { severity: critical }
          annotations:
            summary: "Context {{ printf "{{ $labels.context }}" }} is poisoned — all writes fail until restart"
            description: >-
              An fsync failure poisoned the engine. The process reports
              healthy while rejecting every append. Restart the pod after
              checking the underlying volume.

        - alert: KronosDBWritesStalled
          expr: max (kronosdb_native_write_gate_open) == 0
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "No node holds a writable leader claim — writes are stalled"
            description: >-
              No claimed leader for over 2 minutes: quorum loss or a stuck
              election. Reads continue from local data; appends fail.

        - alert: KronosDBDiskAlmostFull
          expr: >-
            kubelet_volume_stats_available_bytes{persistentvolumeclaim=~"data-{{ include "kronosdb.fullname" . }}-.*"}
            / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~"data-{{ include "kronosdb.fullname" . }}-.*"}
            < 0.20
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "KronosDB volume {{ printf "{{ $labels.persistentvolumeclaim }}" }} below 20% free"
            description: >-
              Without archive.maxLocalBytes the store keeps every segment;
              with it, segments are evicted only once archived, so the disk
              grows past the cap while archiving or eviction fails. Disk
              exhaustion ends in fsync failure and a poisoned engine. Grow
              the volume, or fix the archive, before it fills.

        {{- if .Values.archive.url }}

        - alert: KronosDBArchiveStalled
          expr: >-
            time() - max by (context) (kronosdb_archive_last_success_timestamp_seconds)
            > {{ max (int64 .Values.alerts.archiveStalledSeconds) (mul 3 (int64 .Values.archive.intervalSecs)) }}
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Context {{ printf "{{ $labels.context }}" }} has not been archived for {{ printf "{{ $value | humanizeDuration }}" }}"
            description: >-
              The leader's archive passes keep failing
              (kronosdb_archive_pass_failures_total). Final segments are
              not copied to the archive, and nodes with a cap cannot evict,
              so their disks grow past it. Check the object store's
              reachability and credentials, and the leader's logs.

        - alert: KronosDBArchiveLagHigh
          expr: max by (context) (kronosdb_archive_lag_events) > {{ int64 .Values.alerts.archiveLagEvents }}
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "Context {{ printf "{{ $labels.context }}" }} archive is {{ printf "{{ $value }}" }} events behind"
            description: >-
              Final segments are archived slower than they are written, or
              not at all. Until they are archived, nodes with a cap cannot
              evict them. Check archive pass failures and the bandwidth to
              the object store.
        {{- if .Values.archive.maxLocalBytes }}

        - alert: KronosDBEvictionFailing
          expr: sum by (pod) (increase(kronosdb_archive_eviction_failures_total[15m])) > 2
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Pod {{ printf "{{ $labels.pod }}" }} cannot evict archived segments"
            description: >-
              Eviction passes fail, so the node's disk grows past
              archive.maxLocalBytes. The node must read the archive to
              check what it evicts: check its access to the object store.
              A segment that differs from its archived copy fails every
              pass and is logged as divergence: investigate that before
              anything else.
        {{- end }}
        {{- end }}

        - alert: KronosDBReplicationLagGrowing
          expr: max by (context) (kronosdb_replication_lag_events) > {{ .Values.alerts.replicationLagEvents }}
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Context {{ printf "{{ $labels.context }}" }} replication lag over {{ .Values.alerts.replicationLagEvents }} events"

        - alert: KronosDBAckDegradation
          expr: sum by (context) (rate(kronosdb_ack_degradations_total[5m])) > 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Context {{ printf "{{ $labels.context }}" }} falling back to durable-mode ack pacing"
            description: >-
              The disk is not keeping up with the written-ack path. Latency
              is about to climb; check volume throughput and fsync latency.

        - alert: KronosDBDCBRejectionSpike
          expr: sum by (context) (rate(kronosdb_dcb_violations_total[5m])) > {{ .Values.alerts.dcbRejectionsPerSecond }}
          for: 10m
          labels: { severity: info }
          annotations:
            summary: "High DCB rejection rate in context {{ printf "{{ $labels.context }}" }}"
            description: >-
              Sustained consistency-condition rejections usually mean many
              writers competing on one tag — a modeling problem (too-coarse
              consistency boundary), not a database problem. Expect client
              retry amplification until the boundary is narrowed.
{{- end }}
